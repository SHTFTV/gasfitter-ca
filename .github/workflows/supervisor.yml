name: Gasfitter read-only supervisor
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/supervisor.yml'
      - 'scripts/supervise.mjs'
permissions:
  contents: read
concurrency:
  group: gasfitter-read-only-supervisor
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/supervise.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: gasfitter-supervisor-${{ github.run_id }}
          path: role-output/
          retention-days: 30
